name: Build MathDoc

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev

      - name: Install CMake
        if: runner.os != 'Linux'
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: ''
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir package
          Copy-Item build/src/Release/mathdoc.exe package/
          windeployqt package/mathdoc.exe

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath MathDoc-Windows.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MathDoc-Windows
          path: MathDoc-Windows.zip

          
      - name: Deploy Qt application
        if: runner.os == 'macOS'
        run: |
          mkdir package
          cp -R build/src/mathdoc.app package/
          macdeployqt package/mathdoc.app

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: |
          cd package
          zip -r ../MathDoc-macOS.zip mathdoc.app

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MathDoc-macOS
          path: MathDoc-macOS.zip

